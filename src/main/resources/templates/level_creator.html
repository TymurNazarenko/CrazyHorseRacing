<!DOCTYPE html>
<html xml:th="http://www.thymeleaf.org" xmlns="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">

<!--This was generated entirely by ChatGPT. TODO: Remove all the fluff-->

<head>
    <meta charset="UTF-8">
    <title>Level Editor</title>

    <style>
        body {
            display: flex;
            gap: 20px;
            font-family: Arial;
        }

        #canvas {
            border: 1px solid black;
        }

        #panel {
            width: 320px;
        }

        .section {
            margin-bottom: 20px;
            border: 1px solid #ccc;
            padding: 8px;
        }

        .item {
            cursor: pointer;
            padding: 4px;
            border-bottom: 1px solid #ddd;
        }

        .selected {
            background: #ffcccc;
        }
    </style>
</head>

<body>

<div>
    <div>
        <button onclick="setMode('wall')">Create New Wall</button>
        <button onclick="setMode('spawn')">Place Spawnpoint</button>
        <button onclick="setMode('carrot')">Place Carrots</button>
        <button id="downloadBtn">Download as JSON</button>
        <br><br>
        <button id="confirmBtn">Confirm</button>
        <button id="cancelBtn">Cancel</button>
    </div>

    <canvas id="canvas" width="1000" height="1000"></canvas>
</div>

<div id="panel">

    <div class="section">
        <b>Walls</b>
        <div id="wallList"></div>
    </div>

    <div class="section">
        <b>Carrot</b>
        <div id="carrotList"></div>
    </div>

    <div class="section">
        <b>Spawnpoints</b>
        <div id="spawnList"></div>
    </div>

</div>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let mode = "wall";
    let backgroundImage = null;
    let backgroundImageName = null;

    let walls = [];
    let carrot = null;
    let spawnpoints = [];

    let temp_hitbox = [];

    let selectedWall = null;

    // Load image
    const spawnImg = new Image();
    spawnImg.src = "/images/horse/pink.png";

    // ==========================
    // MODE
    // ==========================
    function setMode(m) {
        mode = m;
        temp_hitbox = [];
        draw();
    }

    // ==========================
    // DRAW
    // ==========================
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 🖼️ Draw background first
        if (backgroundImage) {
            ctx.drawImage(backgroundImage, 0, 0, canvas.width, canvas.height);
        }  else {
            // Placeholder text
            ctx.fillStyle = "#888";
            ctx.font = "24px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";

            ctx.fillText(
                "Drag and drop background image here",
                canvas.width / 2,
                canvas.height / 2
            );
        }

        // Walls
        walls.forEach((w, i) => {
            ctx.strokeStyle = (i === selectedWall) ? "red" : "black";
            drawHitbox(w);
        });

        // Carrot
        if (carrot) {
            ctx.strokeStyle = "orange";
            drawHitbox(carrot);
        }

        // Temp
        ctx.strokeStyle = "green";
        drawHitbox(temp_hitbox);

        // Spawnpoints
        spawnpoints.forEach(p => {
            drawSpawn(p);
        });
    }

    function drawHitbox(points) {
        if (points.length < 1) return;

        if (points.length > 1) {
            ctx.beginPath();
            ctx.moveTo(points[0].x, points[0].y);

            for (let i = 1; i < points.length; i++) {
                ctx.lineTo(points[i].x, points[i].y);
            }

            ctx.closePath();
            ctx.stroke();
        }

        points.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fill();
        });
    }

    function drawSpawn(p) {
        const size = 100;

        if (spawnImg.complete) {
            ctx.drawImage(
                spawnImg,
                p.x - size / 2,
                p.y - size / 2,
                size,
                size
            );
        } else {
            // fallback
            ctx.fillStyle = "blue";
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // ==========================
    // INPUT
    // ==========================
    canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (mode === "spawn") {
            spawnpoints.push({x, y});
            updateLists();
            draw();
            return;
        }

        if (mode === "wall" || mode === "carrot") {
            temp_hitbox.push({x, y});
            draw();
        }
    });

    // ==========================
    // DRAG & DROP BACKGROUND
    // ==========================
    canvas.addEventListener("dragover", (e) => {
        e.preventDefault(); // required to allow drop
    });

    canvas.addEventListener("drop", (e) => {
        e.preventDefault();

        const file = e.dataTransfer.files[0];
        if (!file || !file.type.startsWith("image/")) return;

        backgroundImageName = file.name; // 🔥 store name

        const reader = new FileReader();

        reader.onload = function(event) {
            const img = new Image();
            img.onload = () => {
                backgroundImage = img;
                draw();
            };
            img.src = event.target.result;
        };

        reader.readAsDataURL(file);
    });

    // ==========================
    // BUTTONS
    // ==========================
    document.getElementById("confirmBtn").onclick = () => {
        if (temp_hitbox.length === 0) return;

        if (mode === "wall") {
            walls.push([...temp_hitbox]);
        }

        if (mode === "carrot") {
            carrot = [...temp_hitbox]; // overwrite (only one allowed)
        }

        temp_hitbox = [];
        updateLists();
        draw();
    };

    document.getElementById("cancelBtn").onclick = () => {
        temp_hitbox = [];
        draw();
    };

    // ==========================
    // LISTS
    // ==========================
    function updateLists() {
        updateWalls();
        updateCarrot();
        updateSpawns();
    }

    // Walls
    function updateWalls() {
        const el = document.getElementById("wallList");
        el.innerHTML = "";

        walls.forEach((w, i) => {
            const div = document.createElement("div");
            div.className = "item";
            if (i === selectedWall) div.classList.add("selected");

            div.textContent = `Wall ${i}`;

            const del = document.createElement("button");
            del.textContent = "Delete";

            del.onclick = (e) => {
                e.stopPropagation();
                walls.splice(i,1);
                if (selectedWall === i) selectedWall = null;
                updateLists();
                draw();
            };

            div.onclick = () => {
                selectedWall = i;
                updateLists();
                draw();
            };

            div.appendChild(del);
            el.appendChild(div);
        });
    }

    // Carrot
    function updateCarrot() {
        const el = document.getElementById("carrotList");
        el.innerHTML = "";

        if (!carrot) return;

        const div = document.createElement("div");
        div.textContent = "Carrot Hitbox";

        const del = document.createElement("button");
        del.textContent = "Delete";

        del.onclick = () => {
            carrot = null;
            updateLists();
            draw();
        };

        div.appendChild(del);
        el.appendChild(div);
    }

    // Spawnpoints
    function updateSpawns() {
        const el = document.getElementById("spawnList");
        el.innerHTML = "";

        spawnpoints.forEach((p, i) => {
            const div = document.createElement("div");
            div.textContent = `Spawn ${i} (${Math.round(p.x)}, ${Math.round(p.y)})`;

            const del = document.createElement("button");
            del.textContent = "Delete";

            del.onclick = () => {
                spawnpoints.splice(i,1);
                updateLists();
                draw();
            };

            div.appendChild(del);
            el.appendChild(div);
        });
    }

    // Initial
    updateLists();
    draw();

    document.getElementById("downloadBtn").onclick = () => {

        const convertPoint = (p) => `[${p.x}, ${p.y}]`;

        const formatHitbox = (hb) =>
            `[${hb.map(convertPoint).join(", ")}]`;

        const formatWalls = (walls) =>
            `[\n    ${walls.map(formatHitbox).join(",\n    ")}\n  ]`;

        const formatCarrot = (carrot) =>
            carrot ? formatHitbox(carrot) : "null";

        const formatSpawns = (spawns) =>
            `[${spawns.map(convertPoint).join(", ")}]`;

        const jsonString = `{
  "id": -1,
  "maxPlayers": ${spawnpoints.length},
  "imagePath": ${backgroundImageName ? `"${backgroundImageName}"` : "null"},
  "horseSize": 1.0,
  "carrot": ${formatCarrot(carrot)},
  "spawnpoints": ${formatSpawns(spawnpoints)},
  "walls": ${formatWalls(walls)}
}`;

        const blob = new Blob([jsonString], { type: "application/json" });
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "level.json";
        a.click();

        URL.revokeObjectURL(url);
    };
</script>

</body>
</html>
