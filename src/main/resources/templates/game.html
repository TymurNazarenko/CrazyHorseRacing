<!DOCTYPE html>
<html xml:th="http://www.thymeleaf.org" xmlns="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Crazy Horse Racing</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <script th:inline="javascript">
        function showConfetti() {
            confetti({particleCount: 200, spread: 90, origin: {y: 0.4}});
            setTimeout(() => confetti({particleCount: 100, angle: 60, spread: 55, origin: {x: 0}}), 300);
            setTimeout(() => confetti({particleCount: 100, angle: 120, spread: 55, origin: {x: 1}}), 500);
        }

        function showWasted(duration = 2500) {
            // Remove any existing overlay
            document.querySelector(".wasted-overlay")?.remove();

            const overlay = document.createElement("div");
            overlay.className = "wasted-overlay";
            overlay.textContent = "WASTED";

            document.body.appendChild(overlay);

            // Trigger fade-in
            requestAnimationFrame(() => {
                overlay.style.opacity = "1";
                overlay.style.background = "rgba(0,0,0,0.45)";
                overlay.style.backdropFilter = "blur(3px)";
            });

            // Fade out
            setTimeout(() => {
                overlay.style.opacity = "0";
                overlay.style.background = "rgba(0,0,0,0)";
                overlay.style.backdropFilter = "blur(0px)";

                overlay.addEventListener("transitionend", () => {
                    overlay.remove();
                }, { once: true });
            }, duration);
        }

        function showYouWin(duration = 2500) {
            document.querySelector(".win-overlay")?.remove();

            const overlay = document.createElement("div");
            overlay.className = "win-overlay";
            overlay.textContent = "YOU WIN";

            document.body.appendChild(overlay);

            requestAnimationFrame(() => {
                overlay.style.opacity = "1";
                overlay.style.transform = "scale(1)";
                overlay.style.background = "rgba(0,0,0,.35)";
                overlay.style.backdropFilter = "blur(2px)";
            });

            setTimeout(() => {
                overlay.style.opacity = "0";
                overlay.style.transform = "scale(0.95)";
                overlay.style.background = "rgba(0,0,0,0)";
                overlay.style.backdropFilter = "blur(0px)";

                overlay.addEventListener("transitionend", () => {
                    overlay.remove();
                }, { once: true });
            }, duration);
        }

        function winEffect() {
            showYouWin();
            showConfetti();
        }

        function loseEffect(winner) {
            showWasted()
        }

        let wallHitboxes = [[${walls}]];
        let carrotHitbox = [[${carrot}]];
        let horseSize = [[${horseSize}]];
        let gameId = [[${gameId}]];
        let myUUID = [[${UUID}]];
        const horses = [];
        let gameover = false;
        let playing = false;

        function getHorseIndex(id) {
            for (let index = 0; index < horses.length; index++) {
                if (horses[index].id === id) {
                    return index;
                }
            }
            return -1;
        }

        const status_socket = new WebSocket(`ws://localhost:8080/ws/game/` + gameId + `/status`);
        status_socket.onmessage = (event) => {
            let str = event.data.toString();
            let message = JSON.parse(str);

            for (let receivedHorse of message.horses) {
                let existingHorseIndex = getHorseIndex(receivedHorse.id);
                if (existingHorseIndex === -1) {
                    console.log("New horse detected");
                    let img = document.createElement("img");
                    document.getElementById("game").appendChild(img);

                    img.setAttribute("class", "horse");
                    img.id = "horse_" + receivedHorse.id;
                    img.src = receivedHorse.type.imagePath;
                    img.height = horseSize*100;
                    img.width = horseSize*100;
                    // TODO style the div more here?
                    // Such as displaying the name of the player owning this horse
                    receivedHorse.dom_elem = img;

                    horses.push(receivedHorse);
                } else {
                    let previousHorse = horses[existingHorseIndex];
                    horses[existingHorseIndex] = receivedHorse;
                    receivedHorse.dom_elem = previousHorse.dom_elem;
                }
            }

            if (!gameover && message.winner !== null) {
                gameover = true;
                // Figure out if the winner is ourselves or not
                let I_Win = message.winner.UUID == myUUID;
                if (I_Win) {
                    winEffect();
                } else {
                    loseEffect(message.winner.username);
                }
            }
        };

        const move_socket = new WebSocket(`ws://localhost:8080/ws/game/` + gameId + `/move`);
        function move_up() {
            move_socket.send("MOVE_UP");
        }
        function move_down() {
            move_socket.send("MOVE_DOWN");
        }
        function move_left() {
            move_socket.send("MOVE_LEFT");
        }
        function move_right() {
            move_socket.send("MOVE_RIGHT");
        }

        document.addEventListener("keydown", function(event) {
            switch (event.key) {
                case "ArrowUp":
                    event.preventDefault();
                    move_up();
                    break;
                case "ArrowDown":
                    event.preventDefault();
                    move_down();
                    break;
                case "ArrowLeft":
                    event.preventDefault();
                    move_left();
                    break;
                case "ArrowRight":
                    event.preventDefault();
                    move_right();
                    break;
            }
        });

        function updateHorsesPositions(delta) {
            for (horse of horses) {
                horse.pos.x = horse.pos.x + horse.velocity.x * delta;
                horse.pos.y = horse.pos.y + horse.velocity.y * delta;
            }
            // TODO check for hitbox intersections?
        }

        let prevFrameTimestamp;
        function updateHorsesVisuals(timestamp) {
            if (prevFrameTimestamp === undefined) { prevFrameTimestamp = timestamp; }
            let delay = (timestamp - prevFrameTimestamp)/1000; // todo clamp value? the first call will cause this to be 0
            prevFrameTimestamp = timestamp;

            // Updating the divs to match their x,y coordinates
            for (let horse of horses) {
                horse.dom_elem.style.top = (horse.pos.y - horse.dom_elem.height/2) + "px";
                horse.dom_elem.style.left = (horse.pos.x - horse.dom_elem.width/2) + "px";
            }

            updateHorsesPositions(delay);

            requestAnimationFrame(updateHorsesVisuals); // animation loop
        }

        updateHorsesVisuals();
    </script>
</head>
<body>
<div layout:fragment="content">
    <h1 style="text-align:center">Your Game</h1>
    <div id="game">
        <img id="level-image" th:src="${levelImage}" alt="If you're seeing this, something went wrong">
    </div>
</div>
</body>
</html>
