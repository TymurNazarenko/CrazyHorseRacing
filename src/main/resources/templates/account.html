<!DOCTYPE html>
<html xml:th="http://www.thymeleaf.org" xmlns="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Crazy Horse Racing</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<div th:if="${error}" class="message error" th:text="${error}"></div>
<div th:if="${success}" class="message success" th:text="${success}"></div>

    <h1 style="text-align:center">Your Account</h1>

    <div class="settings-container">
        <!-- Nickname Form -->
        <form action="/set-nickname" method="post">
            <div class="settings-row">
                <label class="settings-label" for="nickname">Nickname:</label>
                <input class="settings-input" type="text" id="nickname" name="nickname" th:value="${nickname}" required>
                <button class="settings-button" type="submit">Set nickname</button>
            </div>
        </form>

        <!-- Login & Password Form -->
        <form action="/set-login-password" method="post">
            <div class="settings-row">
                <label class="settings-label" for="login">Login:</label>
                <input class="settings-input" type="text" id="login" name="login" th:value="${login}" required>
            </div>

            <div class="settings-row">
                <label class="settings-label" for="password">Password:</label>
                <input class="settings-input" type="password" id="password" name="password" placeholder="Password" th:value="${password}" required>
                <button class="settings-button" type="submit">Set login and password</button>
            </div>
        </form>
    </div>

    <hr>

    <h1 style="text-align:center">Log into another Account</h1>

    <div class="settings-container">
        <!-- Login & Password Form -->
        <form action="/log-in" method="post">
            <div class="settings-row">
                <label class="settings-label" for="login_other">Login:</label>
                <input class="settings-input" type="text" id="login_other" name="login_other" placeholder="Login" required>
            </div>

            <div class="settings-row">
                <label class="settings-label" for="password_other">Password:</label>
                <input class="settings-input" type="password" id="password_other" name="password_other" placeholder="Password" required>
                <button class="settings-button" type="submit">Log in</button>
            </div>
        </form>
    </div>
</body>
</html>
